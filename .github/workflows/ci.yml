name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: |
            clippy
            rustfmt

      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1

      - name: Run clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Build (debug)
        run: cargo build --workspace --verbose

      - name: Build (release)
        run: cargo build --workspace --release --verbose

      - name: Build frontend WASM
        run: cargo build -p frontend --target wasm32-unknown-unknown --release

      - name: wasm-pack build
        run: |
          cd frontend
          cargo install wasm-pack
          wasm-pack build --target web

      - name: Prepare docs folder for GitHub Pages
        run: |
          rm -rf docs
          mkdir -p docs
          cp frontend/index.html docs/
          cp -r frontend/pkg docs/pkg