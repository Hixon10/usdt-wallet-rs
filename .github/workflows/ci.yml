name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 1. PERMISSIONS & CONCURRENCY
# Required for "Deploy to GitHub Pages"
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: |
            clippy
            rustfmt

      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1

      - name: Run clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Build (debug)
        run: cargo build --workspace --verbose

      - name: Build (release)
        run: cargo build --workspace --release --verbose

      - name: Run the generate-mnemonic command as an integration test
        run: cargo run -p cli -- generate-mnemonic

      - name: Build frontend WASM
        run: cargo build -p frontend --target wasm32-unknown-unknown --release

      - name: wasm-pack build
        run: |
          cd frontend
          cargo install wasm-pack
          wasm-pack build --target web

      # We create 'docs' merely as a staging area to upload, not to commit.
      - name: Prepare UPLOAD DIRECTORY
        run: |
          rm -rf docs
          mkdir -p docs
          cp frontend/index.html docs/
          cp -r frontend/pkg docs/pkg
          touch docs/.nojekyll

      # This uploads the 'docs' folder to GitHub Actions (not the repo)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'docs'

  # 5. DEPLOY JOB
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4